&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,
        ))
    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();
&lt;/script&gt;

#fitness-pal-v2{--p-ink:light-dark(#203653,#edf2fe);--p-sub:light-dark(#637189,#b8c4da);--p-blue:light-dark(#42648d,#a8c8f5);--p-on:light-dark(#fff,#182c48);--p-surface:light-dark(#f5f6fb,#1b2435);--p-card:light-dark(#ffffff,#273349);--p-glass:light-dark(#ffffffd6,#273349e8);--p-line:light-dark(#ffffff,#50617b);--p-soft:light-dark(#dce7f8,#334763);--p-peach:light-dark(#ffe0d4,#5b3f3b);--p-rose:light-dark(#f7d8e7,#543e56);--p-stroke:light-dark(#d8e0ed,#47576c);--p-good:light-dark(#376a5c,#a4d6c3);font:14px/1.5 &#x27;Google Sans&#x27;,Arial,sans-serif;color:var(--p-ink);padding:22px 10px;color-scheme:light dark}
#fitness-pal-v2 *{box-sizing:border-box}#fitness-pal-v2 button,#fitness-pal-v2 input,#fitness-pal-v2 textarea{font:inherit}#fitness-pal-v2 button{color:inherit;touch-action:manipulation}#fitness-pal-v2 svg{width:19px;height:19px;flex:none}#fitness-pal-v2 button:disabled{opacity:.5}#fitness-pal-v2 .v2-preview{max-width:438px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:14px}#fitness-pal-v2 .v2-preview b{font-size:17px;font-weight:600}#fitness-pal-v2 .v2-preview span{display:block;font-size:12px;color:var(--p-sub)}#fitness-pal-v2 .v2-preview-note{max-width:438px;font-size:11px;color:var(--p-sub);margin:10px auto 16px}#fitness-pal-v2 .v2-explore{position:relative}#fitness-pal-v2 .v2-explore&gt;button{display:flex;align-items:center;gap:8px;border:1px solid var(--p-stroke);background:var(--p-card);border-radius:15px;padding:10px;font-size:12px}#fitness-pal-v2 #v2-explore-menu{position:absolute;right:0;top:48px;width:215px;z-index:20;background:var(--p-card);border:1px solid var(--p-stroke);border-radius:20px;box-shadow:0 15px 40px #173d5920;padding:8px}#fitness-pal-v2 #v2-explore-menu button{display:flex;align-items:center;gap:9px;width:100%;background:none;border:0;padding:10px;text-align:left;border-radius:12px}#fitness-pal-v2 #v2-explore-menu button:hover{background:var(--p-soft)}

#fitness-pal-v2 #activity-dialog::backdrop{background:#22395250;backdrop-filter:blur(7px)}

#fitness-pal-v2 .dialog-close{width:44px;height:44px;border:1px solid var(--p-stroke);background:var(--p-glass);border-radius:50%;display:grid;place-items:center;flex:none}
#fitness-pal-v2 .activity-art{height:120px;background:linear-gradient(120deg,var(--p-soft),var(--p-peach));border-radius:22px;display:flex;align-items:center;justify-content:center;gap:20px;margin:12px 0 18px}
#fitness-pal-v2 .activity-art .pal{width:100px;height:110px}
#fitness-pal-v2 .activity-art .illustration{width:68px;height:68px;background:var(--p-glass);transform:rotate(-9deg)}
@media(max-width:375px){#fitness-pal-v2{padding:12px 0}}

/* October 13: typography, liquid-glass controls, and a persistent conversation dock. */
#fitness-pal-v2,#fitness-pal-v2 *{font-family:&#x27;Google Sans&#x27;,Arial,sans-serif}
#fitness-pal-v2 h1{font-weight:700}
#fitness-pal-v2 .brand-logo{width:40px;height:40px;object-fit:contain;flex:none;border-radius:50%}
#fitness-pal-v2 .v2-phone{width:100%;max-width:390px;height:auto;min-height:0;aspect-ratio:390 / 694}
#fitness-pal-v2 .v2-preview,#fitness-pal-v2 .v2-preview-note{max-width:390px}
#fitness-pal-v2 .v2-header,#fitness-pal-v2 #v2-nav,#fitness-pal-v2 #v2-chat-dock,#fitness-pal-v2 #v2-status{flex-shrink:0}
#fitness-pal-v2 main{min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
#fitness-pal-v2 #v2-chat-dock{padding:8px 18px 12px;background:light-dark(#f4f5faad,#202c3edb);border-top:1px solid var(--p-line);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
#fitness-pal-v2 #v2-chat-dock[hidden]{display:none}
#fitness-pal-v2 #v2-chat-dock .composer{margin:0;background:var(--p-glass);box-shadow:inset 0 1px 0 #ffffff90,0 5px 20px #27446c0c}
#fitness-pal-v2 #v2-chat-dock .notice{max-height:120px;overflow:auto;margin-bottom:0}
#fitness-pal-v2 .composer textarea{resize:none;min-height:44px;max-height:100px}
#fitness-pal-v2 .button,#fitness-pal-v2 .chip,#fitness-pal-v2 .v2-coins,#fitness-pal-v2 .v2-explore&gt;button{backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:inset 0 1px 0 #ffffffa8,inset 0 -1px 0 #28456912,0 5px 14px #2845690c;transition:background-color .18s,box-shadow .18s}
#fitness-pal-v2 .button,#fitness-pal-v2 .button.quiet,#fitness-pal-v2 .chip[data-a=&quot;prompt&quot;]{background:light-dark(#ffffff26,#ffffff08);border:1px solid var(--p-blue);color:var(--p-blue)}
#fitness-pal-v2 .button.primary{background:var(--p-blue);border-color:var(--p-blue);color:var(--p-on);box-shadow:inset 0 1px 0 #ffffff60,0 6px 16px #28456922}
#fitness-pal-v2 .button.primary,#fitness-pal-v2 :is(.glass,.bubble,.plan-card) .button.primary{background:#42648d;border-color:#42648d;color:#fff;box-shadow:inset 0 1px 0 #ffffff60,0 6px 16px #28456922}
#fitness-pal-v2 .button:hover{box-shadow:inset 0 1px 0 #ffffffa0,0 6px 20px #28456920}
#fitness-pal-v2 .button:active{box-shadow:inset 0 2px 5px #20365320}
#fitness-pal-v2 .message-body{display:flex;align-items:flex-start;flex-direction:column;flex:0 1 auto;width:max-content;max-width:50%;min-width:0}
#fitness-pal-v2 .message-bubble{width:fit-content;max-width:100%;box-sizing:border-box;overflow-wrap:anywhere}
#fitness-pal-v2 .answer{width:fit-content;max-width:50%;margin-left:auto;overflow-wrap:anywhere}
#fitness-pal-v2 #v2-nav button,#fitness-pal-v2 #v2-nav button[data-go=chat]{background:transparent;color:var(--p-sub)}
#fitness-pal-v2 #v2-nav button:hover,#fitness-pal-v2 #v2-explore-menu button:hover{background:var(--p-soft);color:var(--p-blue)}
#fitness-pal-v2 #v2-nav button[aria-current=page],#fitness-pal-v2 #v2-explore-menu button[aria-current=page]{background:var(--p-blue);color:var(--p-on)}
#fitness-pal-v2 .plan-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:12px 0 18px}
#fitness-pal-v2 .plan-days .chip{padding:9px 0;font-size:11px;min-width:0}
@media(max-width:375px){#fitness-pal-v2 #v2-chat-dock{padding:8px 12px 10px}}

/* Scroll indicators appear only during movement, without changing layout. */
html:has(#fitness-pal-v2),#fitness-pal-v2 *{scrollbar-width:thin;scrollbar-color:transparent transparent}
html:has(#fitness-pal-v2)::-webkit-scrollbar,#fitness-pal-v2 *::-webkit-scrollbar{width:5px;height:5px}
html:has(#fitness-pal-v2)::-webkit-scrollbar-track,#fitness-pal-v2 *::-webkit-scrollbar-track{background:transparent}
html:has(#fitness-pal-v2)::-webkit-scrollbar-thumb,#fitness-pal-v2 *::-webkit-scrollbar-thumb{background:transparent;border-radius:10px}
html:has(#fitness-pal-v2)::-webkit-scrollbar-button,#fitness-pal-v2 *::-webkit-scrollbar-button{display:none}
html.fp-scrolling:has(#fitness-pal-v2),#fitness-pal-v2 .fp-scrolling{scrollbar-color:#ffffffa6 transparent}
html.fp-scrolling:has(#fitness-pal-v2)::-webkit-scrollbar-thumb,#fitness-pal-v2 .fp-scrolling::-webkit-scrollbar-thumb{background:#ffffffa6}

/* Keep onboarding progress visible independently of the conversation scroll. */
#fitness-pal-v2 #v2-onboarding-header{flex-shrink:0;padding:8px 23px 0}
#fitness-pal-v2 #v2-onboarding-header[hidden]{display:none}
#fitness-pal-v2 #v2-onboarding-header .progress-line{margin:14px 0 16px}
#fitness-pal-v2 .glass.welcome-options{padding-top:24px;padding-bottom:24px}
#fitness-pal-v2 .welcome-options h3{text-align:center}
/* Translucent menu surface with fully opaque controls. */
#fitness-pal-v2 #v2-nav{background:light-dark(rgb(255 255 255 / 90%),rgb(39 51 73 / 90%));opacity:1;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
#fitness-pal-v2 #v2-nav button{opacity:1}
/* Compensate for the native scroll track so both content edges align. */
#fitness-pal-v2 main{padding-right:calc(23px - var(--scrollbar-space,0px));scrollbar-gutter:auto}
@media(max-width:375px){#fitness-pal-v2 main{padding-right:calc(17px - var(--scrollbar-space,0px))}}

#fitness-pal-v2 .button.session-peach{background:#fae4d8;border:1px solid transparent;color:#203653}

#fitness-pal-v2 .button.voice-outline{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none}
#fitness-pal-v2 .welcome-art .pal-hero{height:180px;width:172.173915px}
@media(max-width:375px){#fitness-pal-v2 #v2-onboarding-header{padding:7px 17px 0}}
/* Welcome spacing and review notice refinements. */
#fitness-pal-v2[data-page=welcome] main{padding-top:7px}
#fitness-pal-v2 .welcome-art{padding-top:0;margin-top:0}
#fitness-pal-v2 .field textarea[data-field=limitations]::placeholder{font-size:12px}
#fitness-pal-v2 #v2-status.draft-notice{display:flex;align-items:flex-start;gap:9px;background:#fae4d8;color:#203653;border-color:#f1d3c2}
#fitness-pal-v2 #v2-status.draft-notice svg{margin-top:1px;width:19px;height:19px;flex:none;color:#42648d}
